<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jarvas Assist — A premium rule-based AI assistant with 40+ conversation rules, fuzzy matching, and a cinematic arc-reactor interface.">
  <title>Jarvas Assist — Premium AI Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <main class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo-ring">
          <svg width="46" height="46" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lg-ring" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#38bdf8"/>
              </linearGradient>
              <linearGradient id="lg-gold" x1="0" y1="0" x2="64" y2="64">
                <stop offset="0" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/>
              </linearGradient>
              <linearGradient id="lg-head" x1="12" y1="16" x2="52" y2="48">
                <stop offset="0" stop-color="#2a3a5c"/><stop offset="1" stop-color="#16233c"/>
              </linearGradient>
            </defs>
            <circle cx="32" cy="32" r="30" stroke="url(#lg-gold)" stroke-width="1.5" opacity=".45"/>
            <circle cx="32" cy="32" r="25" stroke="#38bdf8" stroke-width="1.2" opacity=".35"/>
            <circle cx="32" cy="9" r="2.6" fill="#38bdf8"/>
            <line x1="32" y1="11.6" x2="32" y2="20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="20" x2="4" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
            <line x1="56" y1="20" x2="60" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
            <rect x="12" y="20" width="40" height="32" rx="10" fill="url(#lg-head)" stroke="url(#lg-ring)" stroke-width="1.8"/>
            <rect x="16" y="27" width="32" height="12" rx="6" fill="#0a1322"/>
            <circle cx="24.5" cy="33" r="3.4" fill="#0ea5e9"/>
            <circle cx="39.5" cy="33" r="3.4" fill="#0ea5e9"/>
            <circle cx="24.5" cy="33" r="1.3" fill="#e0f2fe"/>
            <circle cx="39.5" cy="33" r="1.3" fill="#e0f2fe"/>
            <rect x="22" y="44" width="20" height="2.4" rx="1.2" fill="#38bdf8" opacity=".55"/>
            <rect x="25" y="48.4" width="14" height="2" rx="1" fill="#38bdf8" opacity=".35"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>JARVAS <span>ASSIST</span></h1>
          <p>Arc Reactor · AI Assistant</p>
        </div>
      </div>

      <div class="status-card">
        <span class="pulse-chip"><i></i></span>
        <div class="status-copy">
          <strong>Online</strong>
          <small>Rule engine · 40+ intents</small>
        </div>
      </div>

      <div class="examples premium-card">
        <h2>Try asking</h2>
        <button data-message="Hello">👋 Say hello</button>
        <button data-message="What is your name?">🤖 Your name</button>
        <button data-message="What time is it?">🕐 Current time</button>
        <button data-message="What can you do?">💡 Capabilities</button>
        <button data-message="Tell me a joke">😄 Tell me a joke</button>
        <button data-message="Tell me a fun fact">🧠 Fun fact</button>
        <button data-message="Give me a motivational quote">💪 Motivation</button>
        <button data-message="Calculate 25 * 4">🧮 Math</button>
      </div>

      <div class="commands-card premium-card">
        <h2>Quick commands</h2>
        <div class="cmd-row"><code>/help</code><span>Show help</span></div>
        <div class="cmd-row"><code>/clear</code><span>Clear chat</span></div>
        <div class="cmd-row"><code>/export</code><span>Download chat</span></div>
        <div class="cmd-row"><code>/theme</code><span>Toggle theme</span></div>
      </div>

      <button id="clearBtn" class="clear-btn">🗑 Clear conversation</button>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
        <div class="bot-avatar">
          <svg width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="32" cy="32" r="29" stroke="#fcd34d" stroke-width="1.5" opacity=".5"/>
            <rect x="14" y="20" width="36" height="30" rx="9" fill="#0d1b31" stroke="#38bdf8" stroke-width="1.6"/>
            <rect x="18" y="27" width="28" height="11" rx="5.5" fill="#070e1c"/>
            <circle cx="26" cy="32.5" r="3" fill="#0ea5e9"/>
            <circle cx="38" cy="32.5" r="3" fill="#0ea5e9"/>
            <circle cx="26" cy="32.5" r="1.1" fill="#e0f2fe"/>
            <circle cx="38" cy="32.5" r="1.1" fill="#e0f2fe"/>
            <rect x="23" y="42.5" width="18" height="2.4" rx="1.2" fill="#38bdf8" opacity=".55"/>
            <circle cx="32" cy="9.5" r="2.4" fill="#38bdf8"/>
            <line x1="32" y1="12" x2="32" y2="19" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="header-copy">
          <h2>Jarvas Assist</h2>
          <p><span class="online-dot"></span> Arc reactor online · 40+ rules</p>
        </div>
        <div class="header-actions">
          <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
          <button id="exportBtn" class="icon-btn" title="Export chat" aria-label="Export chat">📥</button>
          <div class="stats">
            <div><strong id="messageCount">0</strong><span>Messages</span></div>
            <div><strong id="ruleCount">0</strong><span>Rules</span></div>
          </div>
        </div>
      </header>

      <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

      <div id="suggestions" class="suggestions">
        <button data-message="Hello">Hello 👋</button>
        <button data-message="How are you?">How are you?</button>
        <button data-message="What can you do?">Capabilities</button>
        <button data-message="Tell me a joke">Joke 😄</button>
        <button data-message="Tell me a fun fact">Fun fact 🧠</button>
        <button data-message="Calculate 85 + 15">Math 🧮</button>
      </div>

      <form id="chatForm" class="input-area">
        <div class="input-wrap">
          <input id="userInput" type="text" autocomplete="off"
                 placeholder="Message Jarvas..." aria-label="Message">
          <button type="submit" aria-label="Send message" class="send-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11.5 21 3l-8.5 18-2.4-7.1L3 11.5z" fill="currentColor"/></svg>
          </button>
        </div>
        <small>Press <kbd>Enter</kbd> to send • Type <kbd>/help</kbd> for commands</small>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
